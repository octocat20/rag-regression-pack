name: ci

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run precision/recall baseline
        run: python scripts/run_baseline.py
      - name: Run citation support check
        run: python scripts/check_citations.py
      - name: Enforce regression gates
        run: python scripts/check_gates.py
