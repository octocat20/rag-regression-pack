name: ci

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run precision/recall/MRR baseline
        run: python scripts/run_baseline.py
      - name: Run citation support check
        run: python scripts/check_citations.py
      - name: Enforce regression gates
        run: python scripts/check_gates.py
      - name: Validate dataset references
        run: python scripts/check_dataset.py
      - name: Install pytest
        run: pip install pytest
      - name: Run metric unit tests
        run: pytest tests/ -v

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest
      - name: Run unit tests
        run: pytest tests/ -q
